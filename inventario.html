<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Inventario</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="contenedor">

        <h1>Sistema de Inventario</h1>
        <p class="subtitulo">Proyecto de Integración Continua con Jenkins</p>

        <div class="formulario">

            <input
                type="text"
                id="nombre"
                placeholder="Nombre del producto"
            >

            <input
                type="number"
                id="precio"
                placeholder="Precio"
            >

            <input
                type="number"
                id="stock"
                placeholder="Stock"
            >

            <button onclick="agregarProducto()">
                Agregar producto
            </button>

        </div>

        <h2>Productos registrados</h2>

        <table>

            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Acción</th>
                </tr>
            </thead>

            <tbody id="tablaProductos">
            </tbody>

        </table>

    </div>

    <script src="app.js"></script>

</body>
</html>
